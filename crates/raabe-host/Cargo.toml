[package]
name = "raabe-host"
version = "0.1.0"
description = "The native side shared by RaabeWrite, RaabeCalc and RaabePresent"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
fontdb = "0.23"
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
