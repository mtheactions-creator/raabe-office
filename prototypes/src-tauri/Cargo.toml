[package]
name = "raabe-feel"
version = "0.1.0"
description = "Step 0 feel prototypes for Raabe Office (throwaway)"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "raabe_feel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
